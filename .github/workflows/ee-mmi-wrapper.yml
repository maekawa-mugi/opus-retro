name: EE MMI wrapper model

on: [push, pull_request]

jobs:
  wrapper-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: GCC, UBSan, assertion-enabled model
        run: |
          cc -O2 -std=c99 -Wall -Wextra -Werror \
            -DOPUS_CHECK_ASM=1 -fsanitize=undefined \
            -fno-sanitize-recover=all \
            tests/test_ee_mmi_inner_prod_host.c -o test-ee-model
          ./test-ee-model
      - name: Clang model
        run: |
          clang -O3 -std=c99 -Wall -Wextra -Werror \
            -DOPUS_CHECK_ASM=1 \
            tests/test_ee_mmi_inner_prod_host.c -o test-ee-model-clang
          ./test-ee-model-clang
